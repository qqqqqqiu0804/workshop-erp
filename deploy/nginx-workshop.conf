# =============================================================
# workshop-app Nginx 站点配置
#
# 部署步骤：
#   sudo cp deploy/nginx-workshop.conf /etc/nginx/sites-available/workshop
#   sudo ln -s /etc/nginx/sites-available/workshop /etc/nginx/sites-enabled/workshop
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 申请免费 HTTPS 证书（Let's Encrypt，90 天自动续期）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#
# 注意：把下面两处 your-domain.com 全部替换成你的真实域名
# =============================================================

server {
    listen 80;
    server_name your-domain.com;

    # certbot 续期校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余 HTTP 全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Excel 导入 / 导出需要较大请求体
    client_max_body_size 20m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /home/ubuntu/workshop-app/public;
    index index.html;

    access_log /var/log/nginx/workshop.access.log;
    error_log  /var/log/nginx/workshop.error.log;

    # 静态资源由 Nginx 直出，未命中的反代给 Node
    location / {
        try_files $uri $uri/ @node;
    }

    # 应用绑定 0.0.0.0:3000，此处走回环；公网不可达 3000（安全组未放行）
    location @node {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
